services:
  almond:
    image: almondsh:latest
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true   
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true                                                                                                                    
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8888:8888"

    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./interactive-Pd.A-Scala-solutions:/home/jovyan/solutions
      - ./_figures:/home/jovyan/_figures
      - ./images:/home/jovyan/images

    stdin_open: true
    tty: true

    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
